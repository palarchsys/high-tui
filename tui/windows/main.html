<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>high-tui</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <table id="main">
    <tr id="entete" data-lines="1">
      <td><header id="titre"><h1>high-tui</h1></header></td>
    </tr>
    <tr>
      <td>
        <table id="corps">
          <tr id="listes" data-lines="4">
            <td>
              <nav id="nav-rubriques">
                <h2>Rubriques</h2>
                <ul>
                  <li id="item-reseau" data-focus="load" data-focus-target="valeur-hote" data-focus-file="samples/passage.env" data-focus-name="HOTE" data-enter="edit" data-enter-target="valeur-hote">Réseau</li>
                  <li id="item-notes" data-enter="window" data-enter-href="notes.html">Notes</li>
                </ul>
              </nav>
            </td>
            <td>
              <nav id="nav-fiches">
                <h2>Fiches</h2>
                <ul>
                  <li id="item-passage" data-value="127.0.0.1" data-focus="load" data-focus-target="valeur-hote" data-focus-file="samples/passage.env" data-focus-name="HOTE" data-enter="set" data-enter-target="valeur-hote" data-enter-file="samples/passage.env" data-enter-name="HOTE" data-enter-value="127.0.0.1">Passage</li>
                  <li id="item-archive" data-value="8080" data-focus="load" data-focus-target="valeur-hote" data-focus-file="samples/passage.env" data-focus-name="PORT" data-enter="set" data-enter-target="valeur-hote" data-enter-file="samples/passage.env" data-enter-name="PORT" data-enter-value="8080">Archive</li>
                  <li id="fiche-jeton" data-label="samples/secrets.conf::HFU_PRO_JETON::label" data-value="samples/secrets.conf::HFU_PRO_JETON::value" data-focus="load" data-focus-target="valeur-hote" data-focus-file="samples/passage.env" data-focus-name="HOTE" data-enter="set" data-enter-target="valeur-hote" data-enter-file="samples/passage.env" data-enter-name="HOTE" data-enter-value="samples/secrets.conf::HFU_PRO_JETON::value">Jeton pro</li>
                </ul>
              </nav>
            </td>
            <td>
              <nav id="nav-champs">
                <h2>Champs</h2>
                <ul>
                  <li id="item-nom" data-focus="load" data-focus-target="valeur-hote" data-focus-file="samples/passage.env" data-focus-name="NOM" data-enter="edit" data-enter-target="valeur-hote">Nom</li>
                  <li id="item-hote" data-focus="load" data-focus-target="valeur-hote" data-focus-file="samples/passage.env" data-focus-name="HOTE" data-enter="edit" data-enter-target="valeur-hote">Hôte</li>
                  <li id="item-port" data-focus="load" data-focus-target="valeur-hote" data-focus-file="samples/passage.env" data-focus-name="PORT" data-enter="edit" data-enter-target="valeur-hote">Port</li>
                </ul>
              </nav>
            </td>
            <td>
              <nav id="nav-menu">
                <h2>Menu</h2>
                <ul>
                  <li id="item-ouvrir" data-focus="load" data-focus-target="apercu" data-focus-file="samples/brouillon.txt">Ouvrir</li>
                  <li id="item-modifier" data-focus="load" data-focus-target="valeur-hote" data-focus-file="samples/passage.env" data-focus-name="HOTE" data-enter="edit" data-enter-target="valeur-hote">Modifier</li>
                </ul>
              </nav>
            </td>
          </tr>
          <tr id="edition" data-lines="3">
            <td>
              <input id="valeur-hote" name="HOTE" value="127.0.0.1" data-file="samples/passage.env" data-save="button" data-enter="edit" data-enter-target="valeur-hote">
            </td>
            <td data-fr="2">
              <textarea id="apercu" data-file="samples/passage.env" data-enter="edit" data-enter-target="apercu">HOTE=127.0.0.1</textarea>
            </td>
            <td>
              <textarea id="sortie" readonly data-file="samples/brouillon.txt">Brouillon</textarea>
            </td>
          </tr>
          <tr id="actions" data-lines="1">
            <td><button id="enregistrer" type="button" data-enter="save">Enregistrer</button></td>
            <td><button id="recharger" type="button" data-enter="refresh">Recharger</button></td>
            <td><button id="essai" type="button" data-enter="run" data-enter-run="echo ok" data-enter-output="sortie">Essai local</button></td>
          </tr>
        </table>
      </td>
    </tr>
    <tr id="barre" data-lines="1">
      <td><footer id="statut">Prêt</footer></td>
    </tr>
  </table>
</body>
</html>
